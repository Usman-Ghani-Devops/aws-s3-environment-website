version: 0.2

phases:
  build:
    commands:
      - 'echo "Starting $ENVIRONMENT_NAME build..."'

      - 'echo "Getting parameters for $ENVIRONMENT_NAME..."'

      - 'export ENVIRONMENT=$(aws ssm get-parameter --name "/my-website/$ENVIRONMENT_NAME/environment" --query "Parameter.Value" --output text)'

      - 'export MESSAGE=$(aws ssm get-parameter --name "/my-website/$ENVIRONMENT_NAME/message" --query "Parameter.Value" --output text)'

      - 'echo "Environment: $ENVIRONMENT"'
      - 'echo "Message: $MESSAGE"'

      - 'echo "Replacing placeholders in app.js..."'

      - 'sed -i "s|{{ENVIRONMENT}}|$ENVIRONMENT|g" app.js'
      - 'sed -i "s|{{MESSAGE}}|$MESSAGE|g" app.js'

      - 'echo "$ENVIRONMENT_NAME build completed."'

artifacts:
  files:
    - index.html
    - app.js
    - styles.css